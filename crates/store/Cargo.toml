[package]
name = "stage-select-store"
description = "Stage Select's SQLite store: DAT Revisions, Source Sets, Audits, Jobs, Selection Profiles and Selections"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
stage-select-api.workspace = true
stage-select-engine.workspace = true
jiff.workspace = true
rustix.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
# Fetching from DAT Providers (ADR 0012): blocking HTTP over rustls, so the static image needs no OpenSSL.
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
zip.workspace = true

[features]
# Seams only the store's own tests use, such as making an entry read as owned by another user. Never enabled by a
# crate that ships: the store's tests enable it through the dev-dependency on the store itself below.
test-seams = []

[dev-dependencies]
stage-select-store = { path = ".", features = ["test-seams"] }
stage-select-selection.workspace = true
stage-select-test-fixtures.workspace = true
sevenz-rust2 = { workspace = true, features = ["compress"] }
lzma-rust2.workspace = true
zstd.workspace = true
crc32fast.workspace = true
sha1.workspace = true
tempfile.workspace = true
walkdir.workspace = true
