[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.13.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
stage-select-api = { path = "crates/api" }
stage-select-engine = { path = "crates/engine" }
stage-select-store = { path = "crates/store" }
stage-select-server = { path = "crates/server" }
stage-select-selection = { path = "crates/selection" }
# Fixture writers for the tests, a dev-dependency only.
stage-select-test-fixtures = { path = "crates/test-fixtures" }
clap = { version = "4.6.7", features = ["derive", "env"] }
crc32fast = "1.5.3"
# The built-in Selection engine: Python-compatible regular expressions (lookaround) and ordered sets.
fancy-regex = "0.20.0"
# TorrentZip output (ADR 0007): deflate through zlib, built from the pinned libz-sys source and linked statically.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib"] }
libz-sys = { version = "=1.1.31", default-features = false, features = ["libc", "static"] }
# Library Folder writes: directory-relative `*at` calls with no-follow opens and no-replace renames.
# 7z in Ingest Folders (ADR 0018): read only, LZMA, LZMA2 and zstd. Its writer (`compress`) is for test fixtures alone.
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["zstd"] }
# A 7z's encoded header is decoded by Stage Select itself, within its limits; the same versions `sevenz-rust2` uses.
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "optimization"] }
zstd = "0.14.4"
rustix = { version = "1.1.6", features = ["fs", "param", "process"] }
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = { version = "0.2.38", features = ["serde"] }
md-5 = "0.11.0"
quick-xml = "0.42.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
# Kept names compared as a case-insensitive, normalizing file system (APFS) compares them.
unicode-normalization = "0.1.26"
walkdir = "2.5.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

# `cargo leptos build --release` builds the workbench (crates/ui) to WebAssembly into target/site, which
# `stage-select serve --ui target/site` serves, and the Service binary beside it.
# The Dockerfile's cook steps repeat these packages, the output name and the workbench's profile.
[[workspace.metadata.leptos]]
name = "stage-select"
bin-package = "stage-select"
lib-package = "stage-select-ui"
output-name = "stage-select"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "crates/ui/style/main.css"
assets-dir = "crates/ui/assets"
browserquery = "defaults and fully supports wasm"
lib-profile-release = "wasm-release"
# In place of cargo-leptos's -Oz, with the same features: -O1 runs about three times faster, and its output, though
# larger raw, compresses about 5% smaller in Brotli (#198). The Dockerfile's workbench stage checks these were used.
wasm-opt-features = ["-O1", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

# Sixteen codegen units compile the workbench faster than one, for a Brotli bundle about 5% larger, which wasm-opt's
# -O1 more than makes up: fat LTO still optimizes across crates (#198).
[profile.wasm-release]
inherits = "release"
lto = true
codegen-units = 16

# Line tables (test inherits them) give panics their file and line; CARGO_PROFILE_DEV_DEBUG=true builds full debug info.
[profile.dev]
debug = "line-tables-only"
